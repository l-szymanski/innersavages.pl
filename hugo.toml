baseURL = "https://innersavages.pl/"
title = "Strona główna"
locale = "pl"
defaultContentLanguage = "pl"
enableRobotsTXT = true
summaryLength = 70
disableKinds = ["taxonomy", "term"]

[params]
  author = "Stowarzyszenie Inner Savages"
  description = "Strona Stowarzyszenia"
  themeColor = "#0a0c0d"

[params.cloudflareAnalytics]
  enabled = true
  token = "b5fdbf2933794758a12bcc1b327cd58c"

[markup]
  [markup.goldmark]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = true
    style = "github"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML"]

[outputFormats.RSS]
  baseName = "rss"

[pagination]
  pagerSize = 5
