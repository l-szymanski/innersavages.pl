{{- $destination := strings.TrimPrefix "./" .Destination -}}
{{- $image := .Page.Resources.GetMatch $destination -}}
{{- $src := .Destination -}}
{{- with $image -}}{{- $src = .RelPermalink -}}{{- end -}}
<img src="{{ $src | safeURL }}" alt="{{ .PlainText }}"{{ with .Title }} title="{{ . }}"{{ end }} loading="lazy">
