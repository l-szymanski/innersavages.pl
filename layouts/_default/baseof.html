<!doctype html>
<html lang="{{ site.Language.Locale }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body class="{{ if .IsHome }}is-home{{ end }}">
    {{ partial "header.html" . }}
    <main class="{{ if .IsHome }}home-main{{ else }}container page-main{{ end }}">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
    {{ partial "analytics-consent.html" . }}
  </body>
</html>
